name: Governance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          bash scripts/ci/install-gitleaks.sh --install-dir "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan every reachable Git revision
        run: bash scripts/security/run-gitleaks.sh

  haxe-format:
    name: Haxe formatter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Resolve exact Lix and Haxe tools
        run: |
          npm ci --ignore-scripts
          npx --no-install lix download

      - name: Install exact Haxe formatter
        run: npx --no-install haxelib install formatter 1.18.0 --quiet

      - name: Check repository-owned Haxe formatting
        run: npm run format:haxe:check

  compatibility-contract:
    name: Compatibility contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.3
          - 24.18.0
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Validate schema, identities, lanes, and generated documentation
        run: npm run test:support-matrix

  security-tooling:
    name: Security tooling and bootstrap policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Reject high-severity dependency vulnerabilities
        run: npm run security:audit

      - name: Validate pins, hooks, ignores, and workflow policy
        run: npm run test:security-tooling

      - name: Validate the implementation plan and tracked whitespace
        run: |
          npm run test:plan
          npm run test:support-matrix
          npm run test:architecture
          npm run lint:whitespace
