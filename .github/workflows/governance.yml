name: Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-plan:
    name: Test selection plan (observation only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history for merge-base selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Validate and explain the observed test plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run test:loop:validate
          mkdir -p .nextjshx/testing
          case "$EVENT_NAME" in
            pull_request)
              npm run test:loop:explain -- \
                --base "$PR_BASE" --head "$PR_HEAD" \
                --output .nextjshx/testing/plan.json |
                tee .nextjshx/testing/plan.txt
              ;;
            push)
              if test -n "$PUSH_BASE" &&
                test "$PUSH_BASE" != "0000000000000000000000000000000000000000"; then
                npm run test:loop:explain -- \
                  --base "$PUSH_BASE" --head "$PUSH_HEAD" \
                  --output .nextjshx/testing/plan.json |
                  tee .nextjshx/testing/plan.txt
              else
                npm run test:loop:explain -- \
                  --path config/test-lanes.json \
                  --output .nextjshx/testing/plan.json |
                  tee .nextjshx/testing/plan.txt
              fi
              ;;
            *)
              npm run test:loop:explain -- \
                --path config/test-lanes.json \
                --output .nextjshx/testing/plan.json |
                tee .nextjshx/testing/plan.txt
              ;;
          esac
          {
            echo "## Observed test selection"
            echo
            echo "This plan does not skip any existing required job."
            echo
            echo '```text'
            cat .nextjshx/testing/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          bash scripts/ci/install-gitleaks.sh --install-dir "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan every reachable Git revision
        run: bash scripts/security/run-gitleaks.sh

  haxe-format:
    name: Haxe formatter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Resolve exact Lix and Haxe tools
        run: |
          npm ci --ignore-scripts
          npx --no-install lix download

      - name: Install exact Haxe formatter
        run: npx --no-install haxelib install formatter 1.18.0 --quiet

      - name: Check repository-owned Haxe formatting
        run: npm run format:haxe:check

  compatibility-contract:
    name: Compatibility contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.9.0
          - 24.18.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Validate schema, identities, lanes, and generated documentation
        run: npm run test:support-matrix

  next-stable-fixture:
    name: Stable Next fixture (${{ matrix.bundler.name }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.9.0
          - 24.18.0
        bundler:
          - name: Turbopack
            script: test:fixture:next-stable:turbopack
          - name: webpack
            script: test:fixture:next-stable:webpack
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies and Haxe libraries
        run: |
          npm ci --ignore-scripts
          npx --no-install lix download

      - name: Compile, type-check, and build the stable fixture
        run: npm run ${{ matrix.bundler.script }}

      - name: Smoke-test the production server
        run: npm run test:fixture:next-stable:smoke

  next-stable-declaration-drift:
    name: Stable Next declaration drift (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Require a clean installed-package declaration report
        run: npm run drift:next:stable

  next-canary-declaration-drift:
    name: Next canary declaration drift (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked tooling dependencies
        run: npm ci --ignore-scripts

      - name: Install the exact configured canary without lifecycle scripts
        run: >-
          npm install --prefix "$RUNNER_TEMP/next-canary" --ignore-scripts
          --no-save --no-audit --no-fund next@16.3.0-canary.87

      - name: Classify canary declaration drift
        continue-on-error: true
        env:
          NEXTJSHX_NEXT_PACKAGE_DIR: ${{ runner.temp }}/next-canary/node_modules/next
        run: npm run drift:next:upstream

      - name: Publish the classified report to the workflow summary
        if: always()
        run: |
          report=.nextjshx/next-drift/next-upstream-drift.md
          if test -f "$report"; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

  baseline-test-harness:
    name: Typed boundaries, production actions, snapshots, and package harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Install locked dependencies and Haxe libraries
        run: |
          npm ci --ignore-scripts
          npx --no-install lix download

      - name: Run the reusable evidence harness
        run: npm run test:harness

  showcase-matrix:
    name: Maintained Haxe/Next showcase matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Install locked dependencies and Haxe libraries
        run: |
          npm ci --ignore-scripts
          npx --no-install lix download

      - name: Compile, build, and browser-test every maintained showcase
        run: npm run test:showcases

  todoapp-production-e2e:
    name: Todo app production Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Install locked dependencies and Haxe libraries
        run: |
          npm ci --ignore-scripts
          npx --no-install lix download

      - name: Verify the runner-provided system browser
        run: command -v google-chrome

      - name: Build and test the production todo app with zero retries
        run: npm run test:example:todoapp

  security-tooling:
    name: Security tooling and bootstrap policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.3
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Reject moderate-or-higher dependency vulnerabilities
        run: npm run security:audit

      - name: Validate pins, hooks, ignores, and workflow policy
        run: npm run test:security-tooling

      - name: Validate the implementation plan and tracked whitespace
        run: |
          npm run test:plan
          npm run test:support-matrix
          npm run test:architecture
          npm run lint:whitespace

  governance-result:
    name: Governance final result
    if: always()
    needs:
      - test-plan
      - secret-scan
      - haxe-format
      - compatibility-contract
      - next-stable-fixture
      - next-stable-declaration-drift
      - next-canary-declaration-drift
      - baseline-test-harness
      - showcase-matrix
      - todoapp-production-e2e
      - security-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every declared governance job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const failed = Object.entries(jobs)
            .filter(([, value]) => value.result !== "success")
            .map(([name, value]) => `${name}=${value.result}`);
          if (failed.length > 0) {
            console.error(`required governance jobs did not succeed: ${failed.join(", ")}`);
            process.exit(1);
          }
          console.log(`governance-result: OK: ${Object.keys(jobs).length} declared jobs succeeded`);
          NODE
